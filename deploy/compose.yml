name: triphelper-production
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: triphelper
      POSTGRES_DB: triphelper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triphelper -d triphelper"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://triphelper:${POSTGRES_PASSWORD}@db:5432/triphelper
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?Set FRONTEND_BASE_URL}
      TZ: Europe/Moscow
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    logging: *logging
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./videos:/var/www/videos:ro
      - certificates:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    logging: *logging
  certbot:
    image: certbot/certbot:latest
    profiles: ["maintenance"]
    volumes:
      - certificates:/etc/letsencrypt
      - acme:/var/www/certbot
volumes:
  pgdata:
  uploads:
  certificates:
  acme:
